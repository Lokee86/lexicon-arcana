[package]
name = "lexicon"
version = "0.1.0"
edition = "2024"
description = "Deterministic repository semantic-analysis library"
publish = false

[lib]
name = "lexicon"
path = "src/lib.rs"

[dependencies]
atomicwrites = "0.4"
base64 = "0.22"
fs2 = "0.4"
ignore = "0.4"
notify = "8"
regex = "1"
rustpython-parser = { version = "0.4", features = ["all-nodes-with-ranges"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[lints.rust]
unsafe_code = "forbid"
