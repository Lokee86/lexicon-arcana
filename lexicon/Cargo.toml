[package]
name = "lexicon"
version = "0.1.0"
edition = "2024"
description = "Deterministic repository semantic-analysis library"
publish = false

[lib]
name = "lexicon"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"
