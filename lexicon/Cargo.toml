[package]
name = "lexicon"
version = "0.1.0"
edition = "2024"
description = "Deterministic repository semantic-analysis library"
publish = false

[lib]
name = "lexicon"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
atomicwrites = "0.4"
base64 = "0.22"
cargo_metadata = "0.18"
fs2 = "0.4"
ignore = "0.4"
notify = "8"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
regex = "1"
rustpython-parser = { version = "0.4", features = ["all-nodes-with-ranges"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "parsing", "printing", "visit"] }
tree-sitter = "0.24"
tree-sitter-ruby = "0.23"
toml = "0.8"

[lints.rust]
unsafe_code = "forbid"
