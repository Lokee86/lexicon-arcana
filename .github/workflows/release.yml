name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        default: "0.1.0"
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: source
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version-file: source/lexicon/go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/lexicon/adapters/typescript/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - id: release
        shell: bash
        working-directory: source
        run: |
          version="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          version="${version#v}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Build and package release
        working-directory: source
        run: python scripts/workflow.py release --version "${{ steps.release.outputs.version }}" --output "dist-${{ matrix.target }}"
      - uses: actions/upload-artifact@v6
        with:
          name: lexicon-arcana-${{ matrix.target }}
          path: source/dist-${{ matrix.target }}/${{ steps.release.outputs.version }}/lexicon-arcana-bundle-*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - id: release
        shell: bash
        run: |
          version="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          version="${version#v}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
      - name: Create checksums
        run: cd dist && sha256sum *.zip > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* --title "Lexicon + Arcana ${VERSION}" --generate-notes
          fi
